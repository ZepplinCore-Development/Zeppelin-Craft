# Resource Parser Configuration
# Lines starting with # are comments
# Paths support primary/secondary for cross-platform (Windows/Linux)

[paths]
# Patch-O folder - contains custom content (DBCs, ADTs, WMOs, M2s)
# DBCs will be read from: {patch_o}/DBFilesClient/
# ADTs will be read from: {patch_o}/WORLD/maps/
patch_o = A:\wow-server\Zeppelin-Tools\Open Azeroth\Patch-O
patch_o_secondary = /workspace/project/Zeppelin-Tools/Open Azeroth/Patch-O

# Asset Library - source for finding missing asset dependencies
assets_source = A:\wow-server\Zeppelin-Tools\Asset Library\GAME ASSETS
assets_source_secondary = /workspace/project/Zeppelin-Tools/Asset Library/GAME ASSETS

# Export directory - where extracted assets are placed
export = A:\wow-server\Zeppelin-Tools\Open Azeroth\Resource Parser Export
export_secondary = /workspace/project/Zeppelin-Tools/Open Azeroth/Resource Parser Export

[options]
# Skip files that already exist in export directory
skip_existing_exports = false

# Print verbose logging output
verbose = true

# Duplicate WMO detection and fixing
detect_duplicate_wmos = true
duplicate_wmo_threshold = 1.0
fix_duplicate_wmos = true

# MPQ Building (Phase 4)
# Set to false - MPQ building now handled by Patch Builder for consistency
# Use: Patch Builder.py option 4 (PATCH-O only) or option 5 (all patches)
build_mpq = false

[mpq]
# MPQEditor.exe path (Ladik's MPQ Editor)
mpq_editor = A:\wow-server\Zeppelin-Tools\MPQ Editor\MPQEditor.exe
mpq_editor_secondary = /workspace/project/Zeppelin-Tools/MPQ Editor/MPQEditor.exe

# Output MPQ file path
mpq_output = A:\binhex-nginx\nginx\MPQ\optional\PATCH-O.MPQ
mpq_output_secondary = /workspace/project/Zeppelin-Tools/Open Azeroth/PATCH-O.MPQ
