[worldserver]

########################################
# Profession Experience Configuration
########################################
#
#    ProfessionExperience.KillsEquivalent
#        Description: How many same-level creature kills each profession action is worth.
#                     Base XP is calculated as if the player killed a creature at their own level,
#                     then multiplied by this value. Recipe difficulty color applies on top.
#        Default:     1.0
#

ProfessionExperience.KillsEquivalent = 1.0


#
#    ProfessionExperience.MultGray
#    ProfessionExperience.MultGreen
#    ProfessionExperience.MultYellow
#    ProfessionExperience.MultOrange
#        Description: Multiplier based on recipe difficulty color.
#                     Gray recipes give no XP. Green gives -25%, Yellow is baseline, Orange gives +25%.
#        Default:     0.0  - (ProfessionExperience.MultGray)
#                     0.75 - (ProfessionExperience.MultGreen)
#                     1.0  - (ProfessionExperience.MultYellow)
#                     1.25 - (ProfessionExperience.MultOrange)

ProfessionExperience.MultGray   = 0.0
ProfessionExperience.MultGreen  = 0.75
ProfessionExperience.MultYellow = 1.0
ProfessionExperience.MultOrange = 1.25


#
#    ProfessionExperience.*.Experience
#        Description: Enable/disable XP for each profession. Set to 1.0 to enable, 0.0 to disable.
#        Default:     1.0 - (Enabled: Herbalism, Mining)
#                     0.0 - (Disabled: everything else)

ProfessionExperience.Alchemy.Experience        = 0.00
ProfessionExperience.Blacksmith.Experience     = 0.00
ProfessionExperience.Cooking.Experience        = 0.00
ProfessionExperience.Disenchanting.Experience  = 0.00
ProfessionExperience.Enchanting.Experience     = 0.00
ProfessionExperience.Engineering.Experience    = 0.00
ProfessionExperience.Fishing.Experience        = 0.00
ProfessionExperience.FirstAid.Experience       = 0.00
ProfessionExperience.Herbalism.Experience      = 1.00
ProfessionExperience.Inscription.Experience    = 0.00
ProfessionExperience.Jewelcrafting.Experience  = 0.00
ProfessionExperience.Leatherworking.Experience = 0.00
ProfessionExperience.Lockpick.Experience       = 0.00
ProfessionExperience.Mining.Experience         = 1.00
ProfessionExperience.Skinning.Experience       = 0.00
ProfessionExperience.Smelting.Experience       = 0.00
ProfessionExperience.Tailoring.Experience      = 0.00

