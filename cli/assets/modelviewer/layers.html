<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Layers Picker</title>
<style>
  :root {
    --bg: #0f1520; --panel: #161e2b; --panel2: #1c2636; --line: #2a3648;
    --text: #e6ebf2; --muted: #8b98ab; --accent: #6aa9ff; --good: #4cc38a;
    --warn: #e2b04a; --bad: #e5676b; --chosen: #2c5a3f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 320px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside header { padding: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  body.home .app { display: none; }
  #home { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  #home h1 { margin: 0 0 4px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 16px; }
  .tile { text-align: left; padding: 16px; border-radius: 10px; display: grid; gap: 6px; cursor: pointer; }
  .tile b { font-size: 17px; }
  .tile .n { font-size: 26px; font-weight: 600; }
  .tile .d { color: var(--muted); font-size: 12px; }
  .layerbar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .layerbar b { font-size: 15px; }
  #menu { font-size: 18px; line-height: 1; padding: 6px 10px; }
  #listtoggle { display: none; margin-left: auto; }
  .menu { display: grid; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .menu[hidden] { display: none; }
  .menu button { text-align: left; }
  .drawer { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .drawer #list { flex: 1; min-height: 0; overflow: auto; }
  h1 { font-size: 15px; margin: 0; }
  .progress { color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 4px; flex-wrap: wrap; }
  .row button { flex: 1; }
  input[type=search] { width: 100%; padding: 6px 8px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 8px; cursor: pointer; font: inherit; font-size: 12px; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #08111f; border-color: var(--accent); }
  #list { overflow: auto; flex: 1; }
  .q { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .q:hover { background: var(--panel2); }
  .q.cur { background: #22324a; }
  .q .t { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; overflow-wrap: anywhere; }
  .q .n { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .more { padding: 10px 12px; color: var(--muted); font-size: 12px; }
  .chip { font-size: 11px; padding: 1px 6px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); white-space: nowrap; }
  .chip.ok { border-color: var(--good); color: var(--good); }
  .chip.warn { border-color: var(--warn); color: var(--warn); }
  .chip.bad { border-color: var(--bad); color: var(--bad); }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .top .title { flex: 1; min-width: 0; }
  .top .title b { font-size: 15px; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  #save { font-size: 12px; color: var(--muted); }
  #save.ok { color: var(--good); } #save.err { color: var(--bad); }
  .panes { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 10px; padding: 10px; align-content: start; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  .pane.chosen { border-color: var(--good); box-shadow: 0 0 0 1px var(--good); }
  .sect { grid-column: 1 / -1; color: var(--muted); font-size: 13px; padding: 8px 2px 0; border-top: 1px solid var(--line); }
  .sect b { color: var(--text); }
  .pane.rep iframe { aspect-ratio: 4 / 3; }
  .pane iframe { width: 100%; aspect-ratio: 1 / 1; border: 0; background: #1e2a3a; display: block; flex: none; }
  .pane > .info { flex: 1 1 auto; min-height: 0; overflow: auto; }
  .pane > .ptitle { flex: none; padding: 7px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  /* pinned button on a solid strip the width of the card, so scrolled details never show through */
  .pane > .info .use { position: sticky; bottom: 0; z-index: 1;
    box-shadow: 0 0 0 100vmax var(--panel); clip-path: inset(-8px -100vmax -10px -100vmax); }
  .looks { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1px; background: var(--line); }
  .looks figure { margin: 0; background: var(--panel); display: flex; flex-direction: column; }
  .looks figcaption { font-size: 12px; color: var(--muted); padding: 6px 10px; overflow-wrap: anywhere; }
  .looks figcaption b { color: var(--text); }
  .simw { font-size: 12px; color: var(--muted); display: flex; gap: 4px; align-items: center; margin-top: 4px; }
  .pane canvas { width: 100%; aspect-ratio: 1 / 1; object-fit: contain; flex: none; display: block; image-rendering: pixelated;
    background: repeating-conic-gradient(#2a3648 0 25%, #1c2636 0 50%) 0 0 / 16px 16px; object-fit: contain; }
  .info { padding: 8px 10px; display: grid; gap: 4px; border-top: 1px solid var(--line); }
  .info .h { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .info .stats { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .use { justify-self: start; }
  .empty { color: var(--muted); padding: 30px; }
  .help { color: var(--muted); font-size: 12px; padding: 0 14px 8px; }
  .prov summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  .pb { font-size: 11px; display: grid; gap: 3px; max-height: 300px; overflow: auto; }
  .cust { display: grid; grid-template-columns: minmax(240px, 440px) minmax(240px, 440px) 1fr; gap: 12px; padding: 10px; overflow: auto; }
  .cust .ph { font-size: 12px; padding: 6px 8px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .cust .ph b { color: var(--text); }
  .cust .skinrow { display: grid; grid-template-columns: 120px 1fr 48px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .cust .skinrow canvas { width: 48px; height: 48px; aspect-ratio: auto; }
  .cust .was { font-size: 11px; color: var(--muted); grid-column: 2 / 4; margin-top: -4px; }
  @media (max-width: 900px) { .cust { grid-template-columns: 1fr; } }
  .cust .ctl { display: grid; gap: 8px; align-content: start; }
  .cust label { display: grid; grid-template-columns: 120px 1fr; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .cust select, .cust input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; }
  .cust h3 { margin: 6px 0 0; font-size: 13px; }
  @media (max-width: 760px) { .cust { grid-template-columns: 1fr; } }
  /* phones: one scrolling page - the list (its own scroll), then the model, cards one per row */
  @media (max-width: 760px) {
    html, body { height: auto; }
    .app { display: block; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
    #listtoggle { display: inline-block; }
    aside .drawer { display: none; }
    aside.open .drawer { display: flex; }
    aside.open #list { max-height: 55vh; }
    main { display: block; }
    #help { display: none; }
    .top .title { flex: 1 1 100%; }          /* the model name gets its own full-width row */
    .top { gap: 8px; }
    .panes { overflow: visible; gap: 8px; padding: 8px; }
  }
</style>
</head>
<body>
<div id="home" hidden>
  <h1>Asset Layers Picker</h1>
  <p class="sub">Pick a layer to work in. Counts are what is still undecided.</p>
  <div class="tiles" id="tiles"></div>
</div>
<div class="app">
  <aside id="side">
    <div class="layerbar">
      <button id="menu" title="All layers (home)" aria-label="Back to the layer list">☰</button>
      <b id="layername">Creatures</b>
      <button id="listtoggle" title="Show / hide the model list">List</button>
    </div>
    <div class="menu" id="tabs" hidden>
        <button data-tab="creature" class="on">Creatures</button>
        <button data-tab="character">Characters</button>
        <button data-tab="object">Objects</button>
        <button data-tab="item">Items</button>
        <button data-tab="wmo">WMOs</button>
        <button data-tab="display">Displays</button>
        <button data-tab="texture">Textures</button>
        <button data-tab="custom">Customise</button>
    </div>
    <div class="drawer">
    <header>
      <div class="row" id="filters"></div>
      <input type="search" id="search" placeholder="Path, display id, name or keyword (wolf, tree, legion…)">
      <label class="simw"><input type="checkbox" id="simw"> similar words (wolf finds worgs, hounds…)</label>
      <div class="progress" id="progress"></div>
    </header>
    <div id="list"></div>
    </div>
  </aside>
  <main>
    <div class="top">
      <div class="title"><b id="title">Loading…</b><div class="sub" id="subtitle"></div></div>
      <button id="mode" hidden title="Texture options flat (2D) or on the model (3D)">3D view</button>
      <label id="riderbox" class="simw" hidden title="Seat a character on mounts (attachment 0) to compare seat positions"><input type="checkbox" id="rider"> rider <select id="ridercode"></select></label>
      <select id="anim" title="Animation (all panes)"><option value="0">Stand (0)</option></select>
      <button id="resetcam" title="Reset all views">Reset views</button>
      <span id="save"></span>
    </div>
    <div class="help" id="help"></div>
    <div class="panes" id="panes"></div>
  </main>
</div>
<script src="blp.js"></script>
<script>
// stamped at deploy: a new pane.html is fetched after every deploy (no stale browser copy)
const PANE_V = '__PANE_V__';
// Layered asset selection (F-216): 1. 3D asset (mesh) -> 2. 2D asset (texture) -> 3. customise.
// Choices: choices/layers.json {version: 2, mesh: {path: pick}, texture: {path: pick}, custom: {}}
// Every pick is logged against the options it was made between ({option key: sources}); a new,
// changed or removed option sends it back to review.
const CHOICES_URL = 'choices/layers.json';
const KEY_STORE = 'f216-picker-key';
let pickerKey = '';
try { pickerKey = localStorage.getItem(KEY_STORE) || ''; } catch (e) {}
(() => {
  const m = location.hash.match(/key=([0-9a-f]+)/i);
  if (!m) return;
  pickerKey = m[1];
  try { localStorage.setItem(KEY_STORE, pickerKey); } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search);
})();

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mb = (n) => n >= 1048576 ? (n / 1048576).toFixed(2) + ' MB' : (n / 1024).toFixed(0) + ' KB';
const label = (srcs) => srcs.join(' + ');

let customList = [];
// Retail on demand: the picker asks, the next `zep model viewer` run fetches + converts (WXL way)
let retailIdx = { models: {}, skins: {} };   // data/v2/retail.json
const OUTFIT_SLOTS = ['helm', 'shoulders', 'cape', 'chest', 'shirt', 'tabard', 'wrists', 'gloves', 'belt', 'legs', 'boots'];
let assets = [], texIndex = [], choices = { version: 2, mesh: {}, texture: {}, custom: {}, fit: {}, display: {}, wish: {} };
// All view: every other model (data/v2/catalog.json, loaded the first time All / Shortlist opens)
let catalog = null, catalogLoading = null;
let bodies = {}, fitBody = null;           // item fitting: race/sex bodies ('hum', 'orf', ...)
let riderOn = false, riderCode = 'hum';
let mountSet = new Map();                   // model -> [seat attachment, dx, dy, dz] (data/v2/mounts.json)
let tab = 'creature', filter = 'todo', search = '', cur = null, view = [], texMode = '2d';
const texChunks = {};

const FILTERS = {
  asset: [['todo', 'Undecided'], ['review', 'Review'], ['all', 'All'], ['wish', 'Shortlist']],
  texture: [['decide', 'Needs decision'], ['review', 'Review'], ['all', 'All']],
  custom: [['all', 'All'], ['done', 'Customised']],
};
const HELP = {
  display: 'Display-level 3D choice: packs that point this display at a DIFFERENT model. Each option is drawn with that ' +
           'pack\'s own display rows. Compare panes show our own creature-level edits (read-only).',
  asset: 'Layer 1 — pick the 3D asset (mesh). Packs shipping byte-identical files are one option. ' +
         'Each option is shown wearing its default textures (the largest compatible); pick textures in the Textures tab.',
  custom: 'Layer 3 — customise one display: geosets (creatures), hair / facial hair (characters), or an outfit ' +
          '(retail item ids, built by the F-198 wardrobe with a new bake). The preview uses the mesh\'s current pane.',
  texture: 'Layer 2 — pick the texture. Default = the largest file among options painted for the chosen mesh. ' +
           '"Needs decision": no option fits every mesh using it, or the largest one is painted for another mesh.',
};

// ---- choices + review -----------------------------------------------------------------
// Model-level options: one per pack AS IT SHIPS (stock fallback) = the file it ships at this path
// + the displays it repoints to other models (Spaceslam: 23 golem displays -> arcanegolem2).
// Packs doing exactly the same thing are one option.
let repIdx = null;   // model path -> its Displays-tab entries
function repEntries(path) {
  if (!repIdx) {
    repIdx = {};
    assets.forEach(d => { if (d.tab === 'display' && d.panes.length) (repIdx[d.panes[0].model] = repIdx[d.panes[0].model] || []).push(d); });
  }
  return repIdx[path] || [];
}
const hash = (t) => { let h = 0; for (const ch of t) h = (h * 31 + ch.charCodeAt(0)) | 0; return (h >>> 0).toString(36); };
function modelOptions(e) {
  if (e._mo) return e._mo;
  const ds = e.tab === 'item' || e.tab === 'display' ? [] : repEntries(e.path);
  if (!ds.length) return (e._mo = mergeNear(e, e.panes.map(p => ({ key: p.option, sources: p.sources, file: p, reps: {} }))));
  const stockPane = e.panes.find(p => p.sources.includes('stock')) || e.panes[0];
  const packs = new Set();
  e.panes.forEach(p => p.sources.forEach(x => packs.add(x)));
  ds.forEach(d => d.panes.slice(1).forEach(p => p.sources.forEach(x => packs.add(x))));
  packs.delete('stock'); packs.delete('retail');
  const groups = new Map();
  const add = (src, file, reps) => {
    const ids = Object.keys(reps).sort();
    const sig = file.option + '|' + ids.map(k => k + ':' + reps[k].option).join(',');
    let g = groups.get(sig);
    if (!g) groups.set(sig, g = { key: ids.length ? file.option + '+r' + hash(sig) : file.option, sources: [], file, reps });
    g.sources.push(src);
  };
  add('stock', stockPane, {});
  // a pack decides at MODEL level only what it does to every display at once: its file, or a
  // repoint of ALL the model's (used) displays. A repoint of only some goes to the Displays tab.
  // every used display that STARTED on this model: still on it live, or moved away by a pack
  const used = new Set([...(e.used_ids || []).map(String), ...ds.map(d => String(d.display))]).size || e.displays || ds.length;
  e._used = used;
  e._partial = new Set();
  [...packs].sort().forEach(x => {
    const file = e.panes.find(p => p.sources.includes(x)) || stockPane;
    let reps = {};
    ds.forEach(d => { const rp = d.panes.slice(1).find(p => p.sources.includes(x)); if (rp) reps[d.display] = rp; });
    // a clean swap only: ALL used displays, all to ONE model. Several targets (felbat: 23 to
    // giantvampirebat, 1 to the taxi bat) is not a model swap - decided per display.
    const targets = new Set(Object.values(reps).map(r => r.model));
    if (Object.keys(reps).length && (Object.keys(reps).length < used || targets.size > 1)) {
      Object.keys(reps).forEach(id => e._partial.add(id));
      reps = {};
      if (file === stockPane && !stockPane.sources.includes(x)) return;   // nothing left at model level: not an option here
    }
    add(x, file, reps);
  });
  return (e._mo = mergeNear(e, [...groups.values()]));
}
// near-duplicates (same look, a few bytes of metadata apart: a rider-seat nudge) are ONE card
// whose variants are picked from a menu
function mergeNear(e, gs) {
  // shown as separate cards (the difference can matter: a rider-seat height), each noting it
  gs.forEach(g => {
    const n = (g.file.near || []).find(x => gs.some(h => h !== g && h.file.option === x.option));
    if (n) g.note = `same look as ${label((gs.find(h => h.file.option === n.option) || {}).sources || [])} except: ${n.summary}`;
  });
  return gs;
}
function mergeNearCards(e, gs) {
  const out = [];
  gs.forEach(g => {
    const sig = Object.keys(g.reps).sort().map(k => k + ':' + g.reps[k].option).join(',');
    const m = out.find(h => h._sig === sig && (h.variants || [h]).some(v => (v.file.near || []).some(n => n.option === g.file.option)));
    if (!m) { g._sig = sig; out.push(g); return; }
    if (!m.variants) Object.assign(m, { variants: [{ ...m }], note: (g.file.near.find(n => n.option === m.file.option) || {}).summary });
    m.variants.push(g);
    m.sources = [...new Set([...m.sources, ...g.sources])];
  });
  out.forEach(m => {
    if (!m.variants) return;
    const d = m.variants.findIndex(v => v.file.option === e.current);
    m.def = d < 0 ? 0 : d;
  });
  return out;
}
// classic models with the rider baked into the mount mesh; F-220 replaces them with NPC + mount
// the F-220 scope list (rider / driver baked into the mount mesh)
const FUSED = new Set(['batrider.m2', 'alliancerider.m2', 'alliancerider2.m2', 'horderider.m2', 'goblinrocketcar.m2',
  'gnomerocketcar.m2', 'headlesshorsemanmount.m2', 'mounteddeathknight.m2', 'mounteddeathknight_blaumeux.m2',
  'mounteddeathknight_korthazz.m2', 'mounteddeathknight_mograine.m2', 'mounteddeathknight_zeliek.m2', 'mountedknight.m2',
  'mounteddemonknight.m2', 'terongorefiend_mounted.m2', 'felorcnetherdrakemounted.m2', 'orcdrakerider.m2', 'tauren_mountedcanoe.m2']);
const isFusedRider = (path) => FUSED.has((path || '').split('/').pop());
const F220 = 'Fused rider/driver: the rider is part of the mount model. F-220 replaces these with an NPC on a mount or vehicle.';
// a creature/character model no creature shows (no display, or only unused displays)
const unusedModel = (e) => (e.tab === 'creature' || e.tab === 'character') && !e.retailOnly &&
  !(e.displays_used > 0) && !repEntries(e.path).length;
const nOptions = (e) => (e.tab === 'display' || e.tab === 'item' ? e.panes.length : modelOptions(e).length) +
  (retailIdx.models && retailIdx.models[e.path] ? 1 : 0);
// a pack-only model reached only by per-display repoints (tiger2: packs move 15 of tiger.m2's 58
// displays onto it): each Displays-tab option already carries its pack's file, so the file is
// chosen there too - nothing to decide at model level
let byTarget = null;
function perDisplayTarget(e) {
  if (e.tab !== 'creature' || e.retailOnly || e.panes.some(p => p.sources.includes('stock'))) return false;
  if (!byTarget) {
    byTarget = {};
    assets.forEach(d => { if (d.tab === 'display') d.panes.slice(1).forEach(p => {
      if (p.model !== d.panes[0].model) (byTarget[p.model] = byTarget[p.model] || new Set()).add(d); }); });
  }
  const ds = [...(byTarget[e.path] || [])];
  // every pack that moves them keeps other displays of their stock model in place (deploy's src_partial):
  // a full swap (wendigo -> wendigo2, all 29) is a model-level choice and stays on the card
  if (!ds.length || !ds.every(d => d.src_partial)) return false;
  const ids = new Set(ds.map(d => String(d.display)));
  return (e.used_ids || []).every(id => ids.has(String(id)));
}
// the model's displays its options decide (full repoints); the rest of its repoints are per display
let byPath = null;
function modelDecides(d) {
  if (!byPath) { byPath = {}; assets.forEach(x => { if (x.tab !== 'display') byPath[x.path] = x; }); }
  const m = d.panes.length ? byPath[d.panes[0].model] : null;
  return !!m && modelOptions(m).some(g => g.reps[d.display]);
}
// a display decided by its model's pick (Displays tab: not in the queue, overridable)
function viaModel(d) {
  if (d.tab !== 'display' || !d.panes.length) return null;
  const m = choices.mesh[d.panes[0].model];
  return m && m.displays ? m.displays[String(d.display)] || null : null;
}
function optionsOf(entry) {
  const o = {};
  if (entry.panes && entry.tab !== 'display' && entry.tab !== 'item' && !entry.retailOnly) modelOptions(entry).forEach(g => { o[g.key] = g.sources; });
  else if (entry.panes) entry.panes.forEach(p => { o[p.option] = p.sources; });
  else if (entry.options) entry.options.forEach(x => { o[x.key] = x.sources; });
  // the live Retail remaster pane is an option too: record it, or every pick saved next to it
  // reads as "new option: retail" on the next load
  if (entry.tab !== 'display' && retailIdx.models && retailIdx.models[entry.path]) o.retail = ['retail'];
  return o;
}
function reviewReason(kind, key, entry) {
  const c = choices[kind][key];
  if (!c || !c.options || !entry) return null;
  const now = optionsOf(entry);
  const added = Object.keys(now).filter(k => !(k in c.options));
  const gone = Object.keys(c.options).filter(k => !(k in now));
  if (gone.includes(c.option)) return 'picked option no longer offered';
  if (added.length) return `new option: ${added.map(k => label(now[k])).join(', ')}`;
  if (gone.length) return 'an option was removed';
  return null;
}
async function save(kind, key, entry, optionKey, extra = {}) {
  const status = $('save');
  status.className = ''; status.textContent = 'saving…';

// Cards share the width (2 cards = halves, 3 = thirds; wrap past ~280 px each) and, on one row,

function fitPanes() {

  if (!cards.length) return;

  // phones scroll the whole page: size cards against the screen, not the (unbounded) box
  const phone = innerWidth <= 760;

  const weight = cards.map(c => c.classList.contains('wide') ? Math.max(1, c.querySelectorAll('.looks figure').length) : 1);
  const total = weight.reduce((a, b) => a + b, 0);

  box.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
  cards.forEach((c, i) => { c.style.gridColumn = weight[i] > 1 ? `span ${Math.min(weight[i], cols)}` : ''; });

  cards.forEach(c => {

      const t = document.createElement('div');

      t.append(...h.childNodes);
      h.remove();
      c.prepend(t);
    }
  });
  const views = cards.flatMap(c => [...c.querySelectorAll(':scope > iframe, :scope > canvas, .looks iframe')]);
  views.forEach(v => { v.style.aspectRatio = 'auto'; });

  weight.forEach(w => { if (used === 0 || used + Math.min(w, cols) > cols) { rows++; used = 0; } used += Math.min(w, cols); });
  requestAnimationFrame(() => {
    const colW = (W - gap * (cols - 1)) / cols;
    const title = Math.max(0, ...cards.map(c => (c.querySelector(':scope > .ptitle') || {}).offsetHeight || 0));
    const cap = Math.max(0, ...cards.flatMap(c => [...c.querySelectorAll('.looks figcaption')].map(f => f.offsetHeight)));
    const info = Math.max(0, ...cards.map(c => { const i = c.querySelector(':scope > .info'); return i ? i.scrollHeight : 0; }));
    if (rows === 1) {
      const det = Math.min(Math.max(info, 110), Math.max(110, H * 0.38));      // details: scroll past this
      const h = Math.max(200, H - title - det - 4);
      views.forEach(v => { v.style.height = Math.round(h - (v.closest('.looks') ? cap : 0)) + 'px'; });
      cards.forEach(c => { c.style.height = H + 'px'; });

      const h = Math.max(200, Math.min(colW, H * (phone ? 0.7 : 0.6)));

      cards.forEach(c => { c.style.height = ''; const i = c.querySelector(':scope > .info'); if (i) i.style.maxHeight = '260px'; });
    }

}

  $('subtitle').textContent = [d.path, `used by ${d.nrefs}: ${d.refs.slice(0, 4).join(', ')}${d.nrefs > 4 ? '…' : ''}`,
    d.why && d.why.length ? d.why.join('; ') : ''].filter(Boolean).join(' · ');
  $('riderbox').hidden = true;                       // rider / animation belong to the model tabs
  const can3d = !!d.view;
  $('mode').title = can3d ? 'Texture options flat (2D) or on the model (3D)' : 'No model pane shows this texture yet (2D only)';
  $('mode').disabled = !can3d;
  $('mode').textContent = texMode === '3d' ? '2D view' : '3D view';
  $('panes').innerHTML = d.options.map((o, k) => {
    const chosen = c ? c.option === o.key : o.key === d.current;
    const body = texMode === '3d' && can3d
      ? `<iframe src="${paneUrl(d.view.pane, { ovr: { [d.view.key]: o.cas } })}" loading="lazy"></iframe>`
      : `<canvas data-cas="${o.cas}"></canvas>`;
    return `<div class="pane${chosen ? ' chosen' : ''}">${body}<div class="info">
      <div class="h"><b>${esc(label(o.sources))}</b>${o.key === d.current ? '<span class="chip">default</span>' : ''}
        ${o.compatible ? '' : '<span class="chip bad" title="Painted for a different mesh than the one picked">other mesh</span>'}</div>
      <div class="stats">${o.w}×${o.h} · ${esc(o.fmt || '')}${o.alpha ? ' · alpha ' + o.alpha : ''} · ${o.mips} mips · ${mb(o.size)}</div>
      <button class="use" data-k="${k}">${c && c.option === o.key ? 'Chosen' : 'Use this'}</button></div></div>`;
  }).join('');
  $('panes').querySelectorAll('.use').forEach(b => b.onclick = () => save('texture', d.path, d, d.options[+b.dataset.k].key));
  fitPanes();                                        // same title / view / scrolling-details cards as the model pages
  $('panes').querySelectorAll('canvas[data-cas]').forEach(async cv => {
    try {
      const buf = await fetch('files/cas/' + cv.dataset.cas).then(r => r.arrayBuffer());
      const img = decodeBlp(buf);
      cv.width = img.width; cv.height = img.height;
      cv.getContext('2d').putImageData(new ImageData(img.data, img.width, img.height), 0, 0);
    } catch (err) { cv.replaceWith(Object.assign(document.createElement('div'), { className: 'empty', textContent: 'cannot decode: ' + err.message })); }
  });
}

// ---- layer 3: customise one display ---------------------------------------------------------------
function meshPaneOf(path) {
  // a single-option model (stock only, e.g. display 13's hufmcitizenlow) lives in the All catalogue
  const e = assets.find(a => a.path === path) || (catalog || []).find(a => a.path === path && a.panes && a.panes.length);
  return e ? (e.panes.find(p => p.option === e.current) || e.panes[0]) : null;
}
// Customise data loaded on demand: folder textures per model, stock look per display (chunks of 1000)
let custTex = null, custTexLoading = null;
const custStock = {};
function loadCustTex() {
  if (!custTexLoading) custTexLoading = fetch('data/v2/customise_tex.json', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : {}).catch(() => ({})).then(d => { custTex = d; });
  return custTexLoading;
}
function loadCustStock(did) {
  const k = Math.floor(did / 1000);
  if (!custStock[k]) custStock[k] = fetch(`data/v2/custom_stock/${k}.json`, { cache: 'no-store' })
    .then(r => r.ok ? r.json() : {}).catch(() => ({}));
  return custStock[k].then(d => d[String(did)] || null);
}
const casFid = (cas) => 900000000 + parseInt(cas.slice(0, 7), 16) % 99000000;   // the deploy's alloc() ids
function openCustom(c) {
  cur = c;
  const base = meshPaneOf(c.path);
  if (!base && !catalog) {                           // load the catalogue once, then draw the preview
    ensureCatalog();
    if (catalogLoading) catalogLoading.then(() => { if (cur === c) openCustom(c); });
  }
  const saved = choices.custom[c.display] || {};
  $('title').textContent = `Display ${c.display}`;
  $('subtitle').textContent = [c.names.join(', '), c.path, base && base.display && base.display !== c.display ? `preview textures from display ${base.display}` : ''].filter(Boolean).join(' · ');
  const groupSel = (g, val) => `<label>Group ${g}<select data-g="${g}"><option value="0"${val === 0 ? ' selected' : ''}>hidden (0)</option>` +
    (c.groups[g] || []).filter(v => v).map(v => `<option value="${v}"${v === val ? ' selected' : ''}>${g * 100 + v}</option>`).join('') + '</select></label>';
  let ctl = '';
  if (c.char) {
    const hs = saved.hair_style ?? c.char.hair_style, fh = saved.facial_hair ?? c.char.facial_hair;
    ctl += `<h3>Look (no new bake needed)</h3>
      <label>Hair style<select id="cs-hair">${c.char.hair_options.map(v => `<option${v === hs ? ' selected' : ''}>${v}</option>`).join('')}</select></label>
      <label>Facial hair<select id="cs-facial">${c.char.facial_options.map(v => `<option${v === fh ? ' selected' : ''}>${v}</option>`).join('')}</select></label>
      <h3>Outfit (F-198 wardrobe: new bake)</h3>` +
      OUTFIT_SLOTS.map(sl => `<label>${sl}<input data-slot="${sl}" inputmode="numeric" placeholder="retail item id" value="${esc((saved.outfit || {})[sl] || '')}"></label>`).join('');
  } else {
    const gs = saved.geosets || c.cgd;
    ctl += '<h3>Geosets (CreatureDisplayInfo.creature_geoset_data)</h3>' + [1, 2, 3, 4, 5, 6, 7, 8].filter(g => c.groups[g]).map(g => groupSel(g, gs[g - 1])).join('');
    if ((c.slots || []).length) {
      const opts = (custTex || {})[c.path] || [];
      const cur = saved.skins || c.skins || ['', '', ''];
      ctl += '<h3>Skins (texture_variation, any texture in the model\'s folder)</h3>' + c.slots.map(k => {
        const v = String(cur[k] || ''), has = opts.some(([n]) => n.toLowerCase() === v.toLowerCase());
        return `<div class="skinrow"><span>Skin ${k + 1}</span><select data-skin="${k}">
          ${has || !v ? '' : `<option value="${esc(v)}" selected>${esc(v)} (not in this folder)</option>`}
          ${opts.map(([n]) => `<option value="${esc(n)}"${n.toLowerCase() === v.toLowerCase() ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select>
          <canvas data-thumb="${k}"></canvas></div>
          <div class="was">now: ${esc(String((c.skins || [])[k] || '(blank)'))}</div>`;
      }).join('') + (custTex ? '' : '<div class="was">loading the folder\'s textures…</div>');
    }
  }
  ctl += `<div class="row"><button id="cs-save">Save customisation</button><button id="cs-clear">Clear</button></div>`;
  $('panes').innerHTML = `<div class="cust" style="grid-column: 1 / -1">
    <div class="pane"><div class="ph"><b>Stock display ${c.display}</b> · the original, for reference</div><div id="cs-stock"><div class="empty">loading…</div></div></div>
    <div class="pane"><div class="ph"><b>Customised</b> · what ships</div><div id="cs-pane"></div></div>
    <div class="ctl">${ctl}</div></div>`;
  loadCustStock(c.display).then(sp => {
    if (cur !== c) return;
    $('cs-stock').innerHTML = sp ? `<iframe src="${paneUrl(sp)}"></iframe>` : '<div class="empty">No stock look: this display is not in the stock client.</div>';
  });
  if (!custTex && (c.slots || []).length) loadCustTex().then(() => { if (cur === c) openCustom(c); });
  const skinPick = () => [...document.querySelectorAll('#panes select[data-skin]')].reduce((a, sl) => (a[+sl.dataset.skin] = sl.value, a), (saved.skins || c.skins || ['', '', '']).slice());
  const casOf = (stem) => { const hit = ((custTex || {})[c.path] || []).find(([n]) => n.toLowerCase() === String(stem).toLowerCase()); return hit ? hit[1] : null; };
  const thumbs = () => document.querySelectorAll('#panes canvas[data-thumb]').forEach(async cv => {
    const cas = casOf(skinPick()[+cv.dataset.thumb]);
    if (!cas) return;
    try {
      const img = decodeBlp(await fetch('files/cas/' + cas).then(r => r.arrayBuffer()));
      cv.width = img.width; cv.height = img.height;
      cv.getContext('2d').putImageData(new ImageData(img.data, img.width, img.height), 0, 0);
    } catch (err) { /* thumbnail only */ }
  });
  const preview = () => {
    if (!base) { $('cs-pane').innerHTML = '<div class="empty">No preview pane for this mesh.</div>'; return; }
    const p = { ...base, display: c.display };
    if (c.char) {
      const m = (base.mesh || new Array(20).fill(1)).slice();
      const hs = $('cs-hair').value, fh = $('cs-facial').value;
      if (c.char.hair_geo[hs] !== undefined) m[0] = c.char.hair_geo[hs];
      const f = c.char.facial_geo[fh];
      if (f) { m[1] = f[0]; m[3] = f[1]; m[2] = f[2]; }
      p.mesh = m;
    } else {
      const g = [...document.querySelectorAll('#panes select[data-g]')].reduce((a, s) => (a[+s.dataset.g - 1] = +s.value, a), c.cgd.slice());
      p.mesh = [0, ...g];
    }
    let ovr = null;
    if (!c.char && (c.slots || []).length && custTex) {
      const sk = (p.skins || [0, 0, 0]).slice();
      ovr = {};
      skinPick().forEach((stem, k) => { const cas = casOf(stem); if (cas && c.slots.includes(k)) { sk[k] = casFid(cas); ovr['fdid/' + sk[k]] = cas; } });
      p.skins = sk;
    }
    $('cs-pane').innerHTML = `<iframe src="${paneUrl(p, ovr ? { ovr } : {})}"></iframe>`;
    thumbs();
  };
  $('panes').querySelectorAll('select').forEach(s => s.onchange = preview);
  $('cs-save').onclick = () => {
    const pick = { at: new Date().toISOString(), path: c.path };
    if (c.char) {
      pick.hair_style = +$('cs-hair').value; pick.facial_hair = +$('cs-facial').value;
      const outfit = {};
      document.querySelectorAll('#panes input[data-slot]').forEach(i => { if (i.value.trim()) outfit[i.dataset.slot] = +i.value.trim(); });
      if (Object.keys(outfit).length) pick.outfit = outfit;
    } else {
      pick.geosets = [...document.querySelectorAll('#panes select[data-g]')].reduce((a, s) => (a[+s.dataset.g - 1] = +s.value, a), c.cgd.slice());
      const sk = skinPick();
      if (sk.some((v, k) => String(v || '').toLowerCase() !== String((c.skins || [])[k] || '').toLowerCase())) pick.skins = sk;
    }
    saveCustom(c.display, pick);
  };
  $('cs-clear').onclick = () => saveCustom(c.display, null);
  preview();
  render();
}
async function saveCustom(did, pick) {
  const status = $('save');
  status.className = ''; status.textContent = 'saving…';
  try {
    const latest = await fetch(CHOICES_URL, { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
    const merged = { version: 2, mesh: { ...(latest.mesh || {}), ...choices.mesh }, texture: { ...(latest.texture || {}), ...choices.texture },
                     custom: { ...(latest.custom || {}), ...choices.custom }, fit: { ...(latest.fit || {}), ...(choices.fit || {}) },
                     display: { ...(latest.display || {}), ...(choices.display || {}) },
                     wish: { ...(latest.wish || {}), ...(choices.wish || {}) } };
    if (pick) merged.custom[did] = pick; else delete merged.custom[did];
    const headers = { 'Content-Type': 'application/json' };
    if (pickerKey) headers['X-Picker-Key'] = pickerKey;
    const r = await fetch(CHOICES_URL, { method: 'PUT', headers, body: JSON.stringify(merged, null, 1) });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    choices = merged;
    status.className = 'ok'; status.textContent = pick ? `saved display ${did}` : `cleared display ${did}`;
    render();
  } catch (e) { status.className = 'err'; status.textContent = 'save failed: ' + e.message; }
}

function openItem(x) {
  if (!x) { $('panes').innerHTML = '<div class="empty">Nothing here.</div>'; return; }
  if (Array.isArray(x)) openTexture(x); else if (x.display !== undefined && x.groups) openCustom(x); else openAsset(x);
}

// ---- events ---------------------------------------------------------------------------------------------
// ---- home page: pick a layer, each layer is its own address (?layer=creature) ------------------
const LAYERS = [
  ['creature', 'Creatures', 'Creature models: stock, community packs, retail remasters'],
  ['character', 'Characters', 'Player-race character models and their bakes'],
  ['object', 'Objects', 'Doodads and game-object models'],
  ['item', 'Items', 'Weapons, helms, shoulders - fitted on a body'],
  ['wmo', 'WMOs', 'Buildings and world map objects'],
  ['display', 'Displays', 'Per-display choices: packs pointing one display at another model'],
  ['texture', 'Textures', 'Layer 2: which texture ships for each path'],
  ['custom', 'Customise', 'Layer 3: geosets, hair, outfits per display'],
];
function layerCounts(t) {
  if (t === 'texture') return [texIndex.filter(x => x[4].length).length, 'need a decision'];
  if (t === 'custom') return [Object.keys(choices.custom || {}).length, `customised of ${customList.length.toLocaleString()}`];
  const keep = [tab, filter, search];
  tab = t; filter = 'todo'; search = '';
  const n = assets.filter(assetMatches).length;
  [tab, filter, search] = keep;
  return [n, 'undecided'];
}
function showHome(push = true) {
  $('tiles').innerHTML = LAYERS.map(([k, name, d]) => { const [n, what] = layerCounts(k);
    return `<button class="tile" data-layer="${k}"><b>${name}</b><span class="n">${n.toLocaleString()}</span><span class="d">${what} · ${d}</span></button>`; }).join('');
  document.body.classList.add('home');
  $('home').hidden = false;
  if (push) history.pushState({ home: 1 }, '', location.pathname);
}
function openCustom_(did, push = true) {
  openLayer('custom', false);
  const c = customList.find(x => x.display === +did);
  if (push) history.pushState({ layer: 'custom', display: +did }, '', `${location.pathname}?layer=custom&display=${+did}`);
  if (c) { openItem(c); render(); }
  else $('panes').innerHTML = `<div class="empty">Display ${+did} has nothing to customise (no geoset groups, hair or outfit).</div>`;
}
function openLayer(t, push = true) {
  const b = $('tabs').querySelector(`button[data-tab="${t}"]`);
  if (!b) return showHome(push);
  document.body.classList.remove('home');
  $('home').hidden = true;
  if (push) history.pushState({ layer: t }, '', `${location.pathname}?layer=${t}`);
  b.click();
}
$('tiles').onclick = (ev) => { const b = ev.target.closest('.tile'); if (b) openLayer(b.dataset.layer); };
addEventListener('popstate', () => { const u = new URLSearchParams(location.search), t = u.get('layer');
  t === 'custom' && u.get('display') ? openCustom_(u.get('display'), false) : t ? openLayer(t, false) : showHome(false); });
$('menu').onclick = () => showHome();
$('listtoggle').onclick = () => { $('side').classList.toggle('open'); };
if (innerWidth <= 760) $('side').classList.add('open');              // phones start on the list
$('tabs').onclick = (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  $('layername').textContent = b.textContent;
  $('tabs').hidden = true;
  if (innerWidth <= 760) $('side').classList.add('open');
  tab = b.dataset.tab;
  [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b));
  filter = tab === 'texture' ? 'decide' : tab === 'custom' ? 'all' : 'todo';
  render(); openItem(view[0]);
};
$('filters').onclick = (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  filter = b.dataset.f; render(); openItem(view[0]);
};
$('search').oninput = (ev) => { search = ev.target.value.trim().toLowerCase(); render(); };
$('simw').onchange = (ev) => { similar = ev.target.checked; render(); };
$('rider').onchange = (ev) => { riderOn = ev.target.checked; if (cur && !Array.isArray(cur)) openItem(cur); };
$('ridercode').onchange = (ev) => { riderCode = ev.target.value; if (riderOn && cur && !Array.isArray(cur)) openItem(cur); };
$('list').onclick = (ev) => {
  const q = ev.target.closest('.q'); if (!q) return;
  openItem(q.dataset.p !== undefined ? texIndex.find(t => t[0] === q.dataset.p)
    : q.dataset.d !== undefined ? customList.find(c => String(c.display) === q.dataset.d)
    : pool().find(e => e.id === q.dataset.id));
  if (innerWidth <= 760) { $('side').classList.remove('open'); scrollTo({ top: 0 }); }   // phones: the model, full screen
};
$('mode').onclick = () => { texMode = texMode === '3d' ? '2d' : '3d'; if (Array.isArray(cur)) openTexture(cur); };
$('resetcam').onclick = () => document.querySelectorAll('.pane iframe').forEach(f => f.contentWindow && f.contentWindow.postMessage({ type: 'resetcam' }, '*'));
// animation menu: the union of every open pane's animations, applied to all panes
let animNames = {}, animSets = new Map();   // pane window -> its animation ids
fetch('data/v2/anims.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).catch(() => ({})).then(a => { animNames = a || {}; });
function resetAnims() { animSets = new Map(); $('anim').innerHTML = '<option value="0">Stand (0)</option>'; }
$('anim').addEventListener('change', () => {
  const id = +$('anim').value;
  document.querySelectorAll('.pane iframe').forEach(f => f.contentWindow && f.contentWindow.postMessage({ type: 'anim', id }, '*'));
});
window.addEventListener('message', (e) => {
  const m = e.data || {};
  if (m.type === 'pane-stats') {
    const f = [...document.querySelectorAll('.pane iframe')].find(x => x.contentWindow === e.source);
    const el = f && f.closest('.pane').querySelector('[data-live]');
    if (el) el.textContent = `${m.height ? m.height + ' yd tall · ' : ''}v${m.version} (retail, converted to v264 when picked) · ` +
      `${mb(m.size)} · bones ${m.bones} · particles ${m.particles}`;
  }
  if (m.type === 'pane-anims') {
    animSets.set(e.source, m.ids);
    const all = [...new Set([...animSets.values()].flat())].sort((a, b) => a - b);
    const sel = $('anim'), keep = sel.value;
    sel.innerHTML = all.map(id => `<option value="${id}">${esc(animNames[id] || 'Anim')} (${id})</option>`).join('');
    if (all.includes(+keep)) sel.value = keep;
    else if (+keep) e.source.postMessage({ type: 'anim', id: +keep }, '*');
  }
  if (m.type === 'pane-cam') document.querySelectorAll('.pane iframe').forEach(f => {
    if (f.contentWindow && f.contentWindow !== e.source) f.contentWindow.postMessage({ type: 'cam', cam: m.cam }, '*');
  });
});

(async () => {
  const [a, t, c, cu] = await Promise.all([
    fetch('data/v2/assets.json', { cache: 'no-store' }).then(r => r.json()),
    fetch('data/v2/textures_index.json', { cache: 'no-store' }).then(r => r.json()),
    fetch(CHOICES_URL, { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch('data/v2/customise.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : { displays: [] }).catch(() => ({ displays: [] })),
    fetch('data/v2/bodies.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).catch(() => ({})).then(b => { bodies = b; }),
    fetch('data/v2/retail.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).catch(() => ({})).then(r => { retailIdx = r || {}; }),
    fetch('data/v2/mounts.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : []).catch(() => []).then(m => { mountSet = new Map(Array.isArray(m) ? m.map(x => [x, [0, 0, 0, 0]]) : Object.entries(m || {})); }),
  ]);
  assets = a.assets; texIndex = t; customList = cu.displays;
  if (c) choices = { version: 2, mesh: c.mesh || {}, texture: c.texture || {}, custom: c.custom || {}, fit: c.fit || {}, display: c.display || {}, wish: c.wish || {} };
  const startLayer = new URLSearchParams(location.search).get('layer');
  const startDisplay = new URLSearchParams(location.search).get('display');
  if (startLayer === 'custom' && startDisplay) openCustom_(startDisplay, false);
  else if (startLayer) openLayer(startLayer, false); else { render(); showHome(false); }
})();
</script>
