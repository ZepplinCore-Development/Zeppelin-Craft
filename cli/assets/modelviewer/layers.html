<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Layers Picker</title>
<style>
  :root {
    --bg: #0f1520; --panel: #161e2b; --panel2: #1c2636; --line: #2a3648;
    --text: #e6ebf2; --muted: #8b98ab; --accent: #6aa9ff; --good: #4cc38a;
    --warn: #e2b04a; --bad: #e5676b; --chosen: #2c5a3f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 320px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside header { padding: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  body.home .app { display: none; }
  #home { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  #home h1 { margin: 0 0 4px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 16px; }
  .tile { text-align: left; padding: 16px; border-radius: 10px; display: grid; gap: 6px; cursor: pointer; }
  .tile b { font-size: 17px; }
  .tile .n { font-size: 26px; font-weight: 600; }
  .tile .nums { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .tile .nums b { font-size: 20px; color: var(--text); margin-right: 3px; }
  .tile .nums .r b { color: var(--warn, #e6b450); } .tile .nums .c b { color: var(--good); }
  .tile .d { color: var(--muted); font-size: 12px; }
  .layerbar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .layerbar b { font-size: 15px; }
  #menu { font-size: 18px; line-height: 1; padding: 6px 10px; }
  #listtoggle { display: none; margin-left: auto; }
  .menu { display: grid; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .menu[hidden], [hidden] { display: none !important; }   /* class display rules (.simw flex) must not undo hidden */
  .menu button { text-align: left; }
  .drawer { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .drawer #list { flex: 1; min-height: 0; overflow: auto; }
  h1 { font-size: 15px; margin: 0; }
  .progress { color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 4px; flex-wrap: wrap; }
  .row button { flex: 1; }
  input[type=search] { width: 100%; padding: 6px 8px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 8px; cursor: pointer; font: inherit; font-size: 12px; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #08111f; border-color: var(--accent); }
  #list { overflow: auto; flex: 1; }
  .q { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .q:hover { background: var(--panel2); }
  .q.cur { background: #22324a; }
  .q .t { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; overflow-wrap: anywhere; }
  .q .n { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .more { padding: 10px 12px; color: var(--muted); font-size: 12px; }
  .chip { font-size: 11px; padding: 1px 6px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); white-space: nowrap; }
  .chip.ok { border-color: var(--good); color: var(--good); }
  .chip.warn { border-color: var(--warn); color: var(--warn); }
  .chip.bad { border-color: var(--bad); color: var(--bad); }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .top .title { flex: 1 1 320px; min-width: 240px; }
  .top .title b { font-size: 15px; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  #save { font-size: 12px; color: var(--muted); }
  #save.ok { color: var(--good); } #save.err { color: var(--bad); }
  .panes { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 10px; padding: 10px; align-content: start;
    grid-auto-rows: max-content; }   /* overflow:hidden cards have a 0 minimum: auto rows squeezed them to their titles */
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  .pane.chosen { border-color: var(--good); box-shadow: 0 0 0 1px var(--good); }
  .sect { grid-column: 1 / -1; color: var(--muted); font-size: 13px; padding: 8px 2px 0; border-top: 1px solid var(--line); }
  .sect b { color: var(--text); }
  .pane.rep iframe { aspect-ratio: 4 / 3; }
  .pane iframe { width: 100%; aspect-ratio: 1 / 1; border: 0; background: #1e2a3a; display: block; flex: none; }
  .pane > .info { flex: 1 1 auto; min-height: 0; overflow: auto; }
  .pane > .ptitle { flex: none; padding: 7px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .pane > .actions { flex: none; display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 10px; border-top: 1px solid var(--line); }
  .pane > .actions .row { display: flex; gap: 6px; flex: 1 1 100%; }
  .grpbox { font-size: 12px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
  #ctxbar .sep { opacity: .5; }
  #ctxbar { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: 2px 2px 0; }
  #ctxbar a { color: var(--good); }
  body:not(.showhelp) #help { display: none; }
  .pane > .ptitle .dettog { margin-left: auto; font-size: 11px; padding: 2px 8px; background: none; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); cursor: pointer; }
  .pane.nodet > .info { display: none; }
  .pane > .info { overflow-y: auto; overflow-x: hidden; }
  .dsec { border-top: 1px solid var(--line); padding: 3px 0; }
  .dsec:first-child { border-top: 0; }
  .dsec > summary { cursor: pointer; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 2px 0; }
  .dsec .dtags { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px 0; }
  .dsec .dbody { display: grid; gap: 3px; padding: 3px 0; }
  .outfit { display: grid; gap: 2px; font-size: 12px; }
  .outfit .ofrow { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 6px; }
  .outfit .ofrow > span:first-child { color: var(--muted); }
  .outfit .ofrow.none { color: var(--muted); } .outfit .ok { color: var(--good); } .outfit .warn { color: #e6b450; } .outfit .ofnote { font-size: 11px; color: var(--muted); }
  .dsec .anims { display: grid; gap: 2px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .looks { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1px; background: var(--line); }
  .looks figure { margin: 0; background: var(--panel); display: flex; flex-direction: column; }
  .looks figcaption { font-size: 12px; color: var(--muted); padding: 6px 10px; overflow-wrap: anywhere; }
  .looks figcaption b { color: var(--text); }
  .simw { font-size: 12px; color: var(--muted); display: flex; gap: 4px; align-items: center; margin-top: 4px; }
  .pane canvas { width: 100%; aspect-ratio: 1 / 1; object-fit: contain; flex: none; display: block; image-rendering: pixelated;
    background: repeating-conic-gradient(#2a3648 0 25%, #1c2636 0 50%) 0 0 / 16px 16px; object-fit: contain; }
  .info { padding: 8px 10px; display: grid; gap: 4px; border-top: 1px solid var(--line); }
  .info .h { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .info .stats { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .use, .usecust { justify-self: start; }
  .empty { color: var(--muted); padding: 30px; }
  .help { color: var(--muted); font-size: 12px; padding: 0 14px 8px; }
  .prov summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  .pb { font-size: 11px; display: grid; gap: 3px; max-height: 300px; overflow: auto; }
  .custctl .ph { font-size: 12px; padding: 6px 8px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .custctl .ph b { color: var(--text); }
  .custctl .skinrow { display: grid; grid-template-columns: 120px 1fr 48px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .custctl .skinrow canvas { width: 48px; height: 48px; aspect-ratio: auto; }
  .custctl .was { font-size: 11px; color: var(--muted); margin: -4px 0 0 128px; }
  .custctl .note { font-size: 12px; color: var(--muted); }
  .ofpick { display: flex; gap: 4px; min-width: 0; } .ofpick input { flex: 1; min-width: 0; }
  .wardov { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .wardbox { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: min(1100px, 100%); height: min(760px, 100%); display: flex; flex-direction: column; }
  .wardhd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px; border-bottom: 1px solid var(--line); }
  .wardhd input { flex: 1 1 200px; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .wardarm { display: flex; gap: 4px; flex-wrap: wrap; } .wardarm button.on { background: var(--accent, #4c7dff); color: #fff; }
  .nothumb { width: 96px; height: 96px; background: #111; border-radius: 4px; display: grid; place-items: center; color: var(--muted); font-size: 11px; }
  .wardgrid { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; padding: 10px; align-content: start; }
  .wardtile { display: grid; justify-items: center; gap: 4px; padding: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font-size: 10px; color: var(--muted); }
  .wardtile:hover { border-color: var(--good); } .wardtile canvas { width: 56px; height: 56px; image-rendering: auto; background: #111; border-radius: 4px; }
  .wardtile img { width: 96px; height: 96px; object-fit: contain; background: #111; border-radius: 4px; }
  .creatorlist { overflow: auto; padding: 8px; display: grid; gap: 4px; }
  .q .star { background: none; border: 0; padding: 0 6px 0 0; font-size: 15px; line-height: 1; color: var(--muted); cursor: pointer; }
  .q .star.on { color: #f5c542; }
  .crow { display: grid; gap: 2px; text-align: left; padding: 6px 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font-size: 11px; cursor: pointer; }
  .crow b { color: var(--text); font-size: 13px; } .crow:hover { border-color: var(--good); }
  .wardtile span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .wardmore { font-size: 11px; color: var(--muted); padding: 4px 10px 8px; }
  /* never wider than the card: a grid's auto column takes the longest <option> as its width (Safari) */
  .custctl > .info, .custctl .ctl { grid-template-columns: minmax(0, 1fr); overflow-x: hidden; }
  .custctl label > *, .custctl .skinrow > * { min-width: 0; }
  .custctl h3, .custctl .note { overflow-wrap: anywhere; }
  .pane.custctl > .info { flex: 1 1 auto; max-height: none; }
  .custctl .glab { display: block; font-size: 11px; color: var(--muted); opacity: .85; }
  .custctl .thumbs { display: flex; gap: 6px; } .custctl .thumbs canvas { width: 64px; height: 64px; aspect-ratio: auto; }
  .custctl .ctl { display: grid; gap: 8px; align-content: start; }
  #cs-back { margin-left: auto; }
  @media (max-width: 760px) { .pane.cs-ref { order: 9; } }      /* phones: preview, controls, then the original */
  .custctl label { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .custctl select { width: 100%; min-width: 0; }
  .custctl select, .custctl input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; }
  .custctl h3 { margin: 6px 0 0; font-size: 13px; }
  @media (max-width: 760px) { .cust { grid-template-columns: 1fr; } }
  /* phones: one scrolling page - the list (its own scroll), then the model, cards one per row */
  @media (max-width: 760px) {
    html, body { height: auto; }
    .app { display: block; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
    #listtoggle { display: inline-block; }
    aside .drawer { display: none; }
    aside.open .drawer { display: flex; }
    aside.open #list { max-height: 55vh; }
    main { display: block; }
    #help { display: none; }
    .top .title { flex: 1 1 100%; }          /* the model name gets its own full-width row */
    .top { gap: 8px; }
    .panes { overflow: visible; gap: 8px; padding: 8px; }
  }
</style>
</head>
<body>
<div id="home" hidden>
  <h1>Asset Layers Picker</h1>
  <p class="sub">Pick a layer to work in. Counts are what is still undecided.</p>
  <div class="tiles" id="tiles"></div>
</div>
<div class="app">
  <aside id="side">
    <div class="layerbar">
      <button id="menu" title="All layers (home)" aria-label="Back to the layer list">☰</button>
      <b id="layername">Creatures</b>
      <button id="listtoggle" title="Show / hide the model list">List</button>
    </div>
    <div class="menu" id="tabs" hidden>
        <button data-tab="creature" class="on">Creatures</button>
        <button data-tab="character">Characters</button>
        <button data-tab="object">Objects</button>
        <button data-tab="item">Items</button>
        <button data-tab="wmo">WMOs</button>
        <button data-tab="display">Displays</button>
        <button data-tab="texture">Textures</button>
        <button data-tab="custom">Display editor</button>
    </div>
    <div class="drawer">
    <header>
      <div class="row" id="filters"></div>
      <input type="search" id="search" placeholder="Path, display id, name or keyword (wolf, tree, legion…)">
      <label class="simw"><input type="checkbox" id="simw"> similar words (wolf finds worgs, hounds…)</label>
      <div class="progress" id="progress"></div>
    </header>
    <div id="list"></div>
    </div>
  </aside>
  <main>
    <div class="top">
      <div class="title"><b id="title">Loading…</b><div class="sub" id="subtitle"></div></div>
      <button id="mode" hidden title="Texture options flat (2D) or on the model (3D)">3D view</button>
      <label id="riderbox" class="simw" hidden title="Seat a character on mounts (attachment 0) to compare seat positions"><input type="checkbox" id="rider"> rider <select id="ridercode"></select></label>
      <select id="anim" title="Animation (all panes)"><option value="0">Stand (0)</option></select>
      <button id="resetcam" title="Reset all views">Reset views</button>
      <button id="helptog" title="Show or hide this layer's explanation">?</button>
      <span id="save"></span>
    </div>
    <div class="help" id="help"></div>
    <div class="panes" id="panes"></div>
  </main>
</div>
<script src="blp.js"></script>
<script>
// stamped at deploy: a new pane.html is fetched after every deploy (no stale browser copy)
const PANE_V = '__PANE_V__';
// Layered asset selection (F-216): 1. 3D asset (mesh) -> 2. 2D asset (texture) -> 3. customise.
// Choices: choices/layers.json {version: 2, mesh: {path: pick}, texture: {path: pick}, custom: {}}
// Every pick is logged against the options it was made between ({option key: sources}); a new,
// changed or removed option sends it back to review.
const CHOICES_URL = 'choices/layers.json';
const KEY_STORE = 'f216-picker-key';
let pickerKey = '';
try { pickerKey = localStorage.getItem(KEY_STORE) || ''; } catch (e) {}
(() => {
  const m = location.hash.match(/key=([0-9a-f]+)/i);
  if (!m) return;
  pickerKey = m[1];
  try { localStorage.setItem(KEY_STORE, pickerKey); } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search);
})();

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mb = (n) => n >= 1048576 ? (n / 1048576).toFixed(2) + ' MB' : (n / 1024).toFixed(0) + ' KB';
const label = (srcs) => srcs.join(' + ');

let customList = [];
// Retail on demand: the picker asks, the next `zep model viewer` run fetches + converts (WXL way)
let retailIdx = { models: {}, skins: {} };   // data/v2/retail.json
const OUTFIT_SLOTS = ['helm', 'shoulders', 'cape', 'chest', 'shirt', 'tabard', 'wrists', 'gloves', 'belt', 'legs', 'boots'];
// ---- 3.3.5 outfitter: item displays per slot (data/v2/outfit335) + a live bake composited here, the
// same layers and order as lib/wardrobe/compositor.py (skin, face, facial hair, scalp, underwear, items)
const O335 = { slots: {}, files: null, hgvd: null };
async function o335Load() {
  if (!O335.files) {
    const [f, h] = await Promise.all([fetch('data/v2/outfit335/files.json').then(r => r.json()).catch(() => ({})),
                                      fetch('data/v2/outfit335/hgvd.json').then(r => r.json()).catch(() => ({}))]);
    O335.files = f; O335.hgvd = h;
    await Promise.all(OUTFIT_SLOTS.map(async sl => { O335.slots[sl] = await fetch(`data/v2/outfit335/${sl}.json`).then(r => r.json()).catch(() => ({ items: [] }));
      O335.slots[sl].by = new Map(O335.slots[sl].items.map(e => [e[0], e])); }));
  }
  return O335;
}
const O335_REG = { ArmUpper: [0, 0, 128, 64], ArmLower: [0, 64, 128, 64], Hand: [0, 128, 128, 32], FaceUpper: [0, 160, 128, 32],
  FaceLower: [0, 192, 128, 64], TorsoUpper: [128, 0, 128, 64], TorsoLower: [128, 64, 128, 32], LegUpper: [128, 96, 128, 64],
  LegLower: [128, 160, 128, 64], Foot: [128, 224, 128, 32] };
const O335_DIR = { ArmUpper: 'armuppertexture', ArmLower: 'armlowertexture', Hand: 'handtexture', TorsoUpper: 'torsouppertexture',
  TorsoLower: 'torsolowertexture', LegUpper: 'leguppertexture', LegLower: 'leglowertexture', Foot: 'foottexture' };
const O335_ORDER = ['shirt', 'chest', 'tabard', 'legs', 'belt', 'boots', 'wrists', 'gloves'];   // compositor.py SLOT_ORDER
const _bmp = {};
function casBitmap(cas) {
  if (!cas) return Promise.resolve(null);
  // a remote (wago.tools) texture gives up after 20 s: a slow wago must not freeze the preview
  if (!_bmp[cas]) _bmp[cas] = fetch(/^https?:/.test(cas) ? cas : 'files/cas/' + cas, /^https?:/.test(cas) && AbortSignal.timeout ? { signal: AbortSignal.timeout(20000) } : {}).then(r => r.arrayBuffer()).then(b => { const im = decodeBlp(b);
    return createImageBitmap(new ImageData(im.data, im.width, im.height)); }).catch(() => null);
  return _bmp[cas];
}
// an uncompressed BLP2 (BGRA8888) the pane engine loads like any other texture
function canvasToBlp(cv) {
  const w = cv.width, h = cv.height, px = cv.getContext('2d').getImageData(0, 0, w, h).data;
  const head = 148 + 1024, buf = new ArrayBuffer(head + w * h * 4), dv = new DataView(buf), u8 = new Uint8Array(buf);
  u8.set([66, 76, 80, 50], 0); dv.setUint32(4, 1, true);
  dv.setUint8(8, 3); dv.setUint8(9, 8); dv.setUint8(10, 8); dv.setUint8(11, 0);
  dv.setUint32(12, w, true); dv.setUint32(16, h, true); dv.setUint32(20, head, true); dv.setUint32(84, w * h * 4, true);
  for (let i = 0; i < w * h; i++) { u8[head + 4 * i] = px[4 * i + 2]; u8[head + 4 * i + 1] = px[4 * i + 1]; u8[head + 4 * i + 2] = px[4 * i]; u8[head + 4 * i + 3] = px[4 * i + 3]; }
  return buf;
}
let _bakeUrl = null;
// -> { url (blob BLP bake), mesh overrides {group: value}, items [{a, m, t}], ovr {path: cas} } for an outfit
// the cas of a pane's NPC bake (texture slot 1), from its file map
const _maps = {};
async function bakeCasOf(pane) {
  if (!pane || !pane.map || !pane.tex || !pane.tex['1']) return null;
  if (pane._ovr && pane._ovr['fdid/' + pane.tex['1']]) return pane._ovr['fdid/' + pane.tex['1']];
  if (!_maps[pane.map]) _maps[pane.map] = fetch('data/maps/' + encodeURIComponent(pane.map) + '.json').then(r => r.ok ? r.json() : {}).catch(() => ({}));
  return (await _maps[pane.map])['fdid/' + pane.tex['1']] || null;
}
// retail armour by item id (data/v2/wardrobe/<slot>.json, shared with the browser)
const RW = {};
async function retailSlot(sl) {
  if (!RW[sl]) {
    if (!wardrobe[sl]) wardrobe[sl] = await fetch(`data/v2/wardrobe/${sl}.json`, { cache: 'no-store' }).then(r => r.json()).catch(() => null);
    RW[sl] = new Map(((wardrobe[sl] || {}).items || []).map(e => [e[0], e]));
    RW[sl].build = (wardrobe[sl] || {}).build;
  }
  return RW[sl];
}
async function o335Bake(ch, outfit, hairStyle, facialHair, pane = null) {
  const O = await o335Load(), cs = ch.cs || {}, S = 2, female = ch.gender === 1;
  const isR = (v) => /^r:\d+$/.test(String(v || ''));
  for (const sl of OUTFIT_SLOTS) if (isR(outfit[sl]) || isR((ch.outfit || {})[sl])) await retailSlot(sl);
  const cv = document.createElement('canvas'); cv.width = cv.height = 256 * S;

    fetch('data/v2/bodies.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).catch(() => ({})).then(b => { bodies = b; }),
    fetch('data/v2/retail.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).catch(() => ({})).then(r => { retailIdx = r || {}; }),
    fetch('data/v2/mountriders.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null).then(m => { if (m) mountRiders = m; }),
    fetch('data/v2/mounts.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : []).catch(() => []).then(m => { mountSet = new Map(Array.isArray(m) ? m.map(x => [x, [0, 0, 0, 0]]) : Object.entries(m || {})); }),
  ]);
  assets = a.assets; texIndex = t; customList = cu.displays;
  if (c) choices = { version: 2, mesh: c.mesh || {}, texture: c.texture || {}, custom: c.custom || {}, fit: c.fit || {}, display: c.display || {}, wish: c.wish || {} };
  repairRetailCollisions();
  const startLayer = new URLSearchParams(location.search).get('layer');
  if (Object.values(choices.custom || {}).some(v => v && v.new)) { await loadCreator(); addNewDisplays(); }
  Object.keys(choices.custom || {}).forEach(did => { if (/^\d+$/.test(did)) displayEntry(+did); });
  Object.entries(retailIdx.named || {}).forEach(([path, nm]) => (nm.displays || []).forEach(r => { const d = displayEntry(r[0]); if (!d.panes.length) d.named_of = path; }));
  const startDisplay = new URLSearchParams(location.search).get('display');
  if (startLayer === 'custom' && startDisplay) openCustom_(startDisplay, false);
  else if (startLayer === 'display' && startDisplay) openDisplay(startDisplay, false);
  else if (startLayer && new URLSearchParams(location.search).get('path')) {     // ?layer=creature&path=<model>
    const pth = new URLSearchParams(location.search).get('path');
    openLayer(startLayer, false);
    const go = () => { const x = pool().find(e => e.tab === startLayer && e.path === pth); if (x) { cur = x; render(); openItem(x); } return !!x; };
    if (!go()) { filter = 'all'; render(); const t0 = setInterval(() => { if (go() || catalog) clearInterval(t0); if (catalog) go(); }, 500); }
  }
  else if (startLayer) openLayer(startLayer, false); else { render(); showHome(false); }
})();
</script>
