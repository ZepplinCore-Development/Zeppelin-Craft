<!doctype html>
<html><head><meta charset="utf-8"><title>gl keeper</title></head>
<body>
<script src="glcache.js?v=__GLC_V__"></script>
<script>
// F-216 picker (I-401): one hidden, never-reloaded frame per pane host. It lends each new pane a
// WebGL context on an OffscreenCanvas that already holds the programs earlier panes built, and
// takes it back (freed and reset) when the pane goes. Firefox has no program cache shared
// between contexts, so without this every card rebuilt every shader from scratch.
// The pane's engine draws into the lent context and the pane shows each frame on its own canvas
// (transferToImageBitmap). The context never touches the pane's DOM: a canvas element moved into
// a pane and back kept that pane's whole page alive in Firefox.
// Only panes from this frame's own origin can borrow (they share its realm's objects).
mvGlHooks(WebGL2RenderingContext.prototype);
const ATTRS = { antialias: false, alpha: true, depth: true, stencil: true };   // what the engine asks for
const POOL_MAX = 16;
const pool = [], lent = new Set();
let made = 0, lends = 0, reused = 0;
const lose = (gl) => { const x = gl.getExtension('WEBGL_lose_context'); if (x) x.loseContext(); };
window.lend = function () {
  let l;
  while ((l = pool.pop()) && l.gl.isContextLost()) {}
  if (l) reused++;
  else { const off = new OffscreenCanvas(1, 1), gl = off.getContext('webgl2', ATTRS); if (!gl) return null; l = { off, gl, n: ++made }; }
  lends++;
  lent.add(l);
  l.gl.__objs = [];
  return l;
};
window.give = function (l) {
  if (!l || !lent.delete(l)) return;
  const gl = l.gl;
  for (const k of Object.keys(gl)) if (!['__pc', '__objs'].includes(k)) delete gl[k];   // emscripten's ext handles, __diag
  if (gl.isContextLost() || pool.length >= POOL_MAX) return lose(gl);
  try { mvGlReset(gl); } catch (e) { return lose(gl); }
  l.off.width = l.off.height = 1;   // free the drawing buffer while idle
  pool.push(l);
};
window.stats = () => ({ made, lends, reused, idle: pool.length, lent: lent.size,
  programs: [...pool, ...lent].reduce((n, l) => n + (l.gl.__pc ? l.gl.__pc.keep.size : 0), 0) });
</script>
</body></html>
